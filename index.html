<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fairplan</title>
  <meta name="description" content="Fairplan – der Putzplan für deinen Haushalt">
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fairplan">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      const t = localStorage.getItem('fairplan.theme'), a = localStorage.getItem('fairplan.accent');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'zart' : 'dark');
      if (a) document.documentElement.dataset.accent = a;
    } catch {}
  </script>
</head>
<body>
  <main id="app"><p class="loading">Fairplan wird geladen …</p></main>
  <div id="sheet" hidden></div>
  <div id="snack" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
